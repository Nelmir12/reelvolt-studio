services:
  - type: web
    name: reelvolt-youtube-uploader
    runtime: docker
    dockerfilePath: ./youtube-uploader/Dockerfile
    dockerContext: ./youtube-uploader
    healthCheckPath: /health
    maxShutdownDelaySeconds: 300
    autoDeployTrigger: "off"
    envVars:
      - key: REELVOLT_BASE_URL
        sync: false
      - key: YOUTUBE_WORKER_SECRET
        sync: false
      - key: POLL_INTERVAL_MS
        value: "10000"
