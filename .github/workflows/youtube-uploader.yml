name: ReelVolt YouTube uploader

on:
  workflow_dispatch:

concurrency:
  group: reelvolt-youtube-uploader
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  upload-private-short:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify FFmpeg
        run: ffprobe -version

      - name: Process one private Short
        env:
          REELVOLT_BASE_URL: https://reelvolt-studio.ahndias.chatgpt.site
          YOUTUBE_WORKER_SECRET: ${{ secrets.YOUTUBE_WORKER_SECRET }}
          YOUTUBE_ANALYSIS_MODE: manual
          RUN_ONCE: "true"
        run: node youtube-uploader/src/index.mjs
